<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ranking de beach tennis do grupo">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F47721">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ranking BT">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ranking Beach Tennis</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen while Flutter downloads; removed on the first frame. -->
  <style>
    body { margin: 0; background: #FFFFFF; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 28px;
      background: #FFFFFF; transition: opacity 0.3s ease;
    }
    #loading img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(185, 80, 26, 0.35); }
    #loading .spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid rgba(244, 119, 33, 0.25); border-top-color: #F47721;
      animation: spin 0.9s linear infinite;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body, #loading { background: #171717; }
    }
  </style>
</head>
<body>
  <div id="loading" aria-label="Carregando">
    <img src="icons/Icon-192.png" alt="Ranking Beach Tennis">
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      loading.classList.add('done');
      setTimeout(function () { loading.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
